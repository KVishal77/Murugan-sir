<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | RMM Research Group</title>
    <link rel="icon" href="favicon/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="chem-canvas"></canvas>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-area"><img src="logo/logo.png" alt="Logo" onerror="this.style.display='none'"><span>RMM Group</span></a>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="facilities.html">Facilities</a></li>
                <li><a href="members.html" class="active">Members</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="visitors.html">Visitors</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </header>
    <main>
        <h1 class="page-title">Group Members</h1>
        <div class="members-grid" id="membersGrid"></div>
    </main>

    <div class="modal-overlay" id="memberModal">
        <div class="modal-box">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            <div class="modal-body" id="modalBodyContent"></div>
        </div>
    </div>

    <footer><p>&copy; 2026 RMM Group, IIT Bhilai</p></footer>
    <script src="script.js"></script>
    <script>
        const membersData = [
            { name: "Dr. Ramasamy Mayilmurugan", role: "Principal Investigator", category: "Principal investigator", dept: "Associate Professor, Department of Chemistry & Department of Bioscience and Biomedical Engineering, IIT Bhilai[cite: 2, 38]", bio: "Received PhD from Bharathidasan University under Prof. M. Palaniandavar, and postdoctoral work at University of Graz, Austria, and University at Buffalo, USA as a Fulbright Scholar[cite: 38].", education: "M.Sc. Madurai Kamaraj University; Ph.D. Bharathidasan University[cite: 38]", email: "murugan@iitbhilai.ac.in", photo: "images/pi.jpg" },
            { name: "Debabrata Behera", role: "PhD scholar", category: "PhD scholars, Bioscience and Biomedical Engineering", dept: "Department of Bioscience and Biomedical Engineering, IIT Bhilai[cite: 50]", bio: "Debabrata Behera is a PhD scholar working on targeted nanomedicine and cancer biology.", education: "B.Sc. Zoology; M.Sc. Zoology, BHU", email: "debabrata@iitbhilai.ac.in", photo: "member_images/member1.jpg" },
            { name: "K Vishal Johnson", role: "Software engineer / Technical Assistant", category: "Project staff", dept: "Departments of Chemistry and Bioscience and Biomedical Engineering, IIT Bhilai[cite: 52]", bio: "Managing frontend web architectures, responsive interfaces, and research project documentation systems.", education: "B.Tech / Technical Assistant", email: "kvishal@iitbhilai.ac.in", photo: "member_images/member3.jpg" }
        ];

        const membersGrid = document.getElementById('membersGrid');
        membersData.forEach(m => {
            const card = document.createElement('div');
            card.className = 'member-card';
            card.innerHTML = `
                <img src="${m.photo}" alt="${m.name}" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'">
                <h4>${m.name}</h4>
                <p>${m.role}</p>
            `;
            card.addEventListener('click', () => openModal(m));
            membersGrid.appendChild(card);
        });

        const modal = document.getElementById('memberModal');
        const modalClose = document.getElementById('modalClose');
        const modalBodyContent = document.getElementById('modalBodyContent');

        function openModal(member) {
            modalBodyContent.innerHTML = `
                <img src="${member.photo}" alt="${member.name}" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80'">
                <div class="modal-info">
                    <div class="category">${member.category}</div>
                    <h2>${member.name}</h2>
                    <p><strong>${member.role}</strong>, ${member.dept}</p>
                    <p>${member.bio}</p>
                    <div style="font-size:0.9rem; font-weight:600; color:var(--primary); margin-top:1rem; margin-bottom:0.25rem;">Education</div>
                    <p>${member.education}</p>
                    <a href="mailto:${member.email}" class="modal-email-btn">Email</a>
                </div>
            `;
            modal.classList.add('active');
        }

        modalClose.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.remove('active'); });
    </script>
</body>
</html>
