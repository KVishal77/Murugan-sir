  <style>
    /* Chemistry Animated Background Style */
    body {
      background-color: #0f172a;
      background-image: none;
      position: relative;
      overflow-x: hidden;
    }
    
    .chem-bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      opacity: 0.25;
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
    }

    .floating-atom {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-weight: bold;
      font-size: 0.85rem;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 50%;
      animation: floatAround 18s infinite linear;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    @keyframes floatAround {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(60px, 80px) rotate(180deg); }
      100% { transform: translate(0, 0) rotate(360deg); }
    }

    /* Transparent Hero Box (White background removed) */
    .hero-box {
      background: transparent !important;
      backdrop-filter: none !important;
      box-shadow: none !important;
      padding: 1.5rem 0 2rem 0 !important;
      text-align: center;
    }

    /* PI Box & Cards Background */
    .pi-box {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }

    /* Balanced Card Grid for Research */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(280px, 1fr));
      gap: 1.5rem;
      max-width: 1150px;
      margin: 0 auto 3rem auto;
    }

    @media (max-width: 950px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
