<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilities | RMM Research Group</title>
    <link rel="icon" href="favicon/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e3a8a; --primary-light: #3b82f6; --accent: #e11d48; --dark: #0f172a; --light: #f8fafc; --gray: #64748b; --border: #e2e8f0; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); z-index: 1000; }
        .nav-container { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
        .logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--dark); font-weight: 700; font-size: 1.25rem; }
        .logo-area img { height: 40px; }
        .nav-links { display: flex; gap: 1.2rem; list-style: none; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 500; font-size: 0.9rem; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        main { max-width: 1280px; margin: 120px auto 60px; padding: 0 2rem; }
        h1 { font-size: 2.25rem; color: var(--primary); margin-bottom: 2rem; }
        .facilities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .facility-card { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); text-align: center; padding-bottom: 1.5rem; }
        .facility-card img { width: 100%; height: 180px; object-fit: cover; margin-bottom: 1rem; }
        .facility-card h4 { color: var(--primary); padding: 0 1rem; font-size: 1.1rem; }
        footer { background: var(--dark); color: #fff; text-align: center; padding: 2rem; margin-top: 4rem; }
        @media(max-width:968px){ .nav-links { display: none; } }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="about.html" class="logo-area"><img src="logo/logo.png" alt="Logo" onerror="this.style.display='none'"><span>RMM Group</span></a>
            <ul class="nav-links">
                <li><a href="about.html">About</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="facilities.html" class="active">Facilities</a></li>
                <li><a href="members.html">Members</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="visitors.html">Visitors</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </header>
    <main>
        <h1>Lab Facilities</h1>
        <div class="facilities-grid">
            <div class="facility-card">
                <img src="facility_images/minispec.jpg" alt="minispec Relaxometer" onerror="this.src='https://images.unsplash.com/photo-1581093458791-9f3c3900df4b?auto=format&fit=crop&w=400&q=80'">
                <h4>minispec Relaxometer</h4>
            </div>
            <div class="facility-card">
                <img src="facility_images/uv.jpg" alt="UV-Visible Spectrophotometer" onerror="this.src='https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?auto=format&fit=crop&w=400&q=80'">
                <h4>UV-Visible Spectrophotometer</h4>
            </div>
            <div class="facility-card">
                <img src="facility_images/microscope.jpg" alt="Nikon Inverted Microscope" onerror="this.src='https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&w=400&q=80'">
                <h4>Nikon Inverted Microscope</h4>
            </div>
            <div class="facility-card">
                <img src="facility_images/incubator.jpg" alt="CO2 Incubator" onerror="this.src='https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&w=400&q=80'">
                <h4>CO2 Incubator</h4>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 RMM Group, IIT Bhilai</p></footer>
</body>
</html>
